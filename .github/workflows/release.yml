name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating the GitHub release and uploading binaries
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          # macOS
          GOOS=darwin GOARCH=amd64  go build -ldflags="-s -w" -o dist/att-darwin-amd64 ./cmd/att
          GOOS=darwin GOARCH=arm64  go build -ldflags="-s -w" -o dist/att-darwin-arm64 ./cmd/att

          # Linux
          GOOS=linux GOARCH=amd64   go build -ldflags="-s -w" -o dist/att-linux-amd64 ./cmd/att
          GOOS=linux GOARCH=arm64   go build -ldflags="-s -w" -o dist/att-linux-arm64 ./cmd/att

          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/att-windows-amd64.exe ./cmd/att

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: dist/*
